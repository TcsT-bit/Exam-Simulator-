<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHANA CALC TECH PARADISE V2.5 - FINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#030303;--card:rgba(20,20,30,0.6);--accent:#00d4ff;--accent2:#a855f7;--text:#f1f5f9;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;}
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Inter', sans-serif;}
  body{background: radial-gradient(circle at top, #1e1b4b, var(--bg)); color:var(--text); padding:15px; min-height:100vh;}
.calc{max-width:1200px; margin:auto; background:var(--card); border-radius:28px; padding:25px; backdrop-filter:blur(25px); border:1px solid rgba(0,212,255,0.2); box-shadow:0 0 40px rgba(168,85,247,0.2);}
  h1{background: linear-gradient(90deg, #00d4ff, #a855f7, #ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; font-size:26px; font-weight:800;}
.subtitle{text-align:center; color:#94a3b8; margin-bottom:20px;}
.tabs{display:flex; gap:10px; margin-bottom:20px; justify-content:center; flex-wrap:wrap;}
.tab-btn{padding:12px 20px; background:#1f2937; border:none; border-radius:12px; color:#fff; cursor:pointer; font-weight:700;}
.tab-btn.active{background:linear-gradient(135deg, #00d4ff, #a855f7);}
.grid{display:grid; grid-template-columns: 1fr 1fr; gap:15px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}
.card{background:rgba(0,0,0,0.4); padding:20px; border-radius:18px; border:1px solid rgba(255,255,255,0.1);}
.card h2{font-size:18px; margin-bottom:12px; color:var(--accent);}
.subject-btn{padding:18px; margin:8px 0; background: linear-gradient(135deg, #3b0764, #581c87); border:1px solid rgba(168,85,247,0.3); border-radius:14px; color:#fff; cursor:pointer; font-weight:800; width:100%; font-size:15px; transition:0.3s;}
.subject-btn:hover{transform:translateY(-2px); box-shadow:0 5px 20px rgba(168,85,247,0.4);}
.upload-box{border:2px dashed var(--accent); border-radius:14px; padding:25px; text-align:center; cursor:pointer; transition:0.3s;}
.upload-box:hover{background:rgba(0,212,255,0.1);}
.upload-box input{display:none;}
.btn{padding:14px 20px; background: linear-gradient(135deg, #00d4ff, #a855f7); border:none; border-radius:12px; color:#fff; cursor:pointer; font-weight:700; margin:5px; transition:0.3s;}
.btn:hover{transform:scale(1.05);}
.btn.red{background:linear-gradient(135deg, #ef4444, #dc2626);}
.btn.yellow{background:var(--yellow); color:#000;}
.btn.green{background:var(--green);}
.ai-key{width:100%; padding:12px; background:#1f2937; border:1px solid #374151; border-radius:10px; color:#fff; margin-top:8px;}
</style>
</head>
<body>
<div class="calc">
  <h1>SHANA CALC TECH PARADISE V2.5</h1>
  <p class="subtitle">AI CAPS EXAM SIMULATOR | ALL SA SUBJECTS | Upload Notes → Generate 30 Questions</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event,'secondary')">SECONDARY G8-12</button>
    <button class="tab-btn" onclick="switchTab(event,'primary')">PRIMARY R-7</button>
    <button class="tab-btn" onclick="switchTab(event,'tvet')">TVET N1-N6</button>
    <button class="tab-btn" onclick="switchTab(event,'university')">UNIVERSITY</button>
  </div>

  <div id="menu">
    <div class="grid">
      <div class="card">
        <h2>1. SELECT LEVEL & SUBJECT</h2>
        <div id="subjectList"></div>
      </div>

      <div class="card">
        <h2>2. AI PARADISE: UPLOAD YOUR NOTES</h2>
        <label class="upload-box" for="fileUpload">
          📤 Click or Drag Notes Here<br><small>JPG, PNG, PDF</small>
          <input type="file" id="fileUpload" accept=".pdf,.jpg,.png" onchange="handleUpload(event)">
        </label>
        <input type="password" id="apiKey" class="ai-key" placeholder="Paste your FREE Gemini API Key Here">
        <button class="btn" style="width:100%; font-size:12px;" onclick="saveApiKey()">💾 Save Key Locally</button>
        <div id="keyStatus" style="font-size:11px; color:var(--green); text-align:center; margin-top:4px;"></div>

        <select id="levelSelect" class="ai-key" onchange="updateGradeOptions()">
          <option value="primary">Primary R-7</option>
          <option value="secondary" selected>Secondary G8-12</option>
          <option value="tvet">TVET N1-N6</option>
          <option value="university">University Year 1</option>
        </select>
        <select id="gradeSelect" class="ai-key"></select>
        <select id="subjectSelect" class="ai-key"></select>

        <button class="btn green" style="width:100%; margin-top:10px;" onclick="generateFromNotes()">✨ GENERATE 30 QUESTIONS WITH AI</button>
        <div id="uploadStatus" style="margin-top:10px; font-size:12px;"></div>
      </div>
    </div>
    <div class="card" style="margin-top:15px;">
      <h2>3. MY SAVED QUESTION BANKS</h2>
      <div id="savedBanks">No banks yet.</div>
      <button class="btn yellow" onclick="clearStorage()">Clear All Local Data</button>
    </div>
  </div>
  <div id="examArea" style="display:none;"><div id="questionsArea"></div></div>
</div>

<script>
let currentPaper=[], userAnswers=[], timer, timeLeft=7200, currentQ=0;
let myBanks = JSON.parse(localStorage.getItem('shanaBanks')) || {};
let uploadedFileBase64 = null; let uploadedMimeType = null;

const subjectData = {
  primary: ['Grade R','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7'],
  secondary: ['Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'],
  tvet: ['N1','N2','N3','N4','N5','N6'],
  university: ['Year 1 Semester 1','Year 1 Semester 2']
}
const subjectsByLevel = {
  primary: ['Mathematics','English HL','Natural Science','Social Science','Life Skills','Technology','Creative Arts'],
  secondary: ['Mathematics','Math Literacy','Physical Science','Life Science','Civil Technology','Mechanical Technology','Electrical Technology','Engineering Graphics','Accounting','Business Studies','Economics','Geography','History','English FAL','Afrikaans FAL','Life Orientation','IT','CAT'],
  tvet: ['Building Science','Engineering Drawing','Mathematics N3','Industrial Organisation','Civil Construction','Trade Theory','Plant Operation'],
  university: ['Calculus 1','Physics 1','Chemistry 1','Introduction to Engineering','Academic Literacy','Engineering Graphics','Programming 1']
}

window.onload = () => {
  const savedKey = localStorage.getItem('shanaApiKey');
  if(savedKey) {document.getElementById('apiKey').value = savedKey; document.getElementById('keyStatus').innerText = 'Key Loaded'}
  switchTab(null, 'secondary');
  loadSavedBanks();
}
function saveApiKey(){ localStorage.setItem('shanaApiKey', document.getElementById('apiKey').value); document.getElementById('keyStatus').innerText = 'API Key Saved!'; setTimeout(()=>document.getElementById('keyStatus').innerText='', 2000); }
function switchTab(event, tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(event) event.target.classList.add('active'); else document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
  let html = ''; subjectsByLevel[tab].forEach(sub=>{ html += `<button class="subject-btn" onclick="alert('Upload notes first')">${sub.toUpperCase()}</button>`; });
  document.getElementById('subjectList').innerHTML = html;
  document.getElementById('levelSelect').value = tab;
  updateGradeOptions();
}
function updateGradeOptions(){
  const level = document.getElementById('levelSelect').value.toLowerCase();
  document.getElementById('gradeSelect').innerHTML = subjectData[level].map(g=>`<option>${g}</option>`).join('');
  document.getElementById('subjectSelect').innerHTML = subjectsByLevel[level].map(s=>`<option>${s}</option>`).join('');
}
function saveToStorage(){ localStorage.setItem('shanaBanks', JSON.stringify(myBanks)); loadSavedBanks(); }
function loadSavedBanks(){ let html = ''; for(let key in myBanks){ html += `<div style="background:#1f2937; padding:10px; border-radius:8px; margin:5px 0;">${key} - ${myBanks[key].length} Qs</div>`; } document.getElementById('savedBanks').innerHTML = html || 'No banks yet.'; }
function fileToBase64(file) { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => { uploadedMimeType = file.type; resolve(reader.result.split(',')[1]); } }); }
function handleUpload(e){ const file = e.target.files[0]; if(file) { document.getElementById('uploadStatus').innerText = `✅ Loaded: ${file.name}`; fileToBase64(file).then(b64 => { uploadedFileBase64 = b64; }); }
async function generateFromNotes(){
  const apiKey = document.getElementById('apiKey').value; const file = document.getElementById('fileUpload').files[0];
  const level = document.getElementById('levelSelect').value; const grade = document.getElementById('gradeSelect').value; const subject = document.getElementById('subjectSelect').value;
  if(!apiKey ||!file ||!uploadedFileBase64) return alert('Please add API Key and Upload a file first');
  document.getElementById('uploadStatus').innerText = `⏳ AI generating 30 questions...`;
  const prompt = `You are a South African ${level} CAPS teacher for ${subject} ${grade}. Read uploaded notes and generate EXACTLY 30 exam questions. 10 MCQ, 10 DEF with keywords, 10 APP with keywords. Output ONLY valid JSON array.`;
  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inline_data: { mime_type: uploadedMimeType, data: uploadedFileBase64 } } ] }] })
    });
    const data = await response.json(); if(data.error) throw new Error(data.error.message);
    let text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
    let questions = JSON.parse(text);
    let bankName = `${level} ${grade} ${subject} - ${new Date().toLocaleDateString()}`;
    myBanks[bankName] = questions; saveToStorage();
    document.getElementById('uploadStatus').innerText = `✅ Generated ${questions.length} questions! Saved as "${bankName}"`;
  } catch(err) { document.getElementById('uploadStatus').innerText = `❌ Error: ${err.message}`; }
}
function clearStorage(){ if(confirm('Delete all saved banks?')){ localStorage.removeItem('shanaBanks'); myBanks={}; loadSavedBanks(); } } // FIXED }
</script>
</body>
</html>
