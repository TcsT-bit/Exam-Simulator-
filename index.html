<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHANA CALC TECH PARADISE V4.1 - GOD TIER AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#060710;--card:rgba(15,18,35,0.55);--accent:#00d4ff;--accent2:#a855f7;--text:#f1f5f9;
    --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;--orange:#f97316;
    --glass:rgba(255,255,255,0.05); --border:rgba(0,212,255,0.2);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Inter', sans-serif;}

  /* AMBIENT 5/10 - Animated gradient + glow blobs */
  body{
    background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #581c87 0%, transparent 50%),
                linear-gradient(180deg, #060710, #030303);
    color:var(--text); padding:15px; min-height:100vh; animation: bgMove 20s infinite alternate;
  }
  @keyframes bgMove {
    0% {background-position: 0% 0%, 100% 100%, 0 0}
    100% {background-position: 100% 0%, 0% 100%, 0 0}
  }

 .calc{
    max-width:1200px; margin:auto; background:var(--card); border-radius:28px; padding:25px;
    backdrop-filter:blur(25px); border:1px solid var(--border);
    box-shadow:0 0 60px rgba(168,85,247,0.25), inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  h1{
    background: linear-gradient(90deg, #00d4ff, #a855f7, #f97316);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-align:center; font-size:28px; font-weight:800; letter-spacing:0.5px;
    text-shadow: 0 0 20px rgba(0,212,255,0.3);
  }
 .subtitle{text-align:center; color:#94a3b8; margin-bottom:25px; font-size:14px;}

  /* TABS 5/10 */
 .tabs{display:flex; gap:10px; margin-bottom:25px; justify-content:center; flex-wrap:wrap;}
 .tab-btn{
    padding:12px 20px; background:var(--glass); border:1px solid var(--border);
    border-radius:14px; color:#cbd5e1; cursor:pointer; font-weight:700; transition:0.3s;
  }
 .tab-btn:hover{border-color:var(--accent); transform:translateY(-2px);}
 .tab-btn.active{
    background:linear-gradient(135deg, #00d4ff, #a855f7); color:#fff;
    box-shadow:0 0 20px rgba(0,212,255,0.4); border:none;
  }

 .grid{display:grid; grid-template-columns: 1fr 1fr; gap:20px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  /* CARDS 5/10 - Glassmorphism */
 .card{
    background:var(--glass); padding:22px; border-radius:20px;
    border:1px solid var(--border); backdrop-filter:blur(20px);
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
  }
 .card h2{font-size:17px; margin-bottom:14px; color:var(--accent); font-weight:800;}

 .subject-btn{
    padding:18px; margin:8px 0; background: linear-gradient(135deg, rgba(59,7,100,0.6), rgba(88,28,135,0.6));
    border:1px solid rgba(168,85,247,0.3); border-radius:14px; color:#fff; cursor:pointer;
    font-weight:800; width:100%; font-size:15px; transition:0.3s; text-align:left;
  }
 .subject-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(168,85,247,0.5);
    border-color:var(--accent2);
  }

  /* UPLOAD BOX 5/10 */
 .upload-box{
    border:2px dashed var(--accent); border-radius:16px; padding:30px 20px; text-align:center;
    cursor:pointer; transition:0.3s; background:rgba(0,212,255,0.05);
  }
 .upload-box:hover{background:rgba(0,212,255,0.12); border-color:var(--accent2); transform:scale(1.01);}
 .upload-box input{display:none;}

  /* BUTTONS 5/10 */
 .btn{
    padding:14px 20px; background: linear-gradient(135deg, #00d4ff, #a855f7); border:none;
    border-radius:12px; color:#fff; cursor:pointer; font-weight:800; margin:5px;
    transition:0.3s; box-shadow:0 4px 15px rgba(0,212,255,0.3);
  }
 .btn:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 6px 25px rgba(168,85,247,0.5);}
 .btn.red{background:linear-gradient(135deg, #ef4444, #dc2626);}
 .btn.yellow{background:var(--yellow); color:#000; box-shadow:0 4px 15px rgba(245,158,11,0.3);}

  /* ORANGE GENERATE BUTTON LIKE YOUR SCREENSHOT */
 .btn.orange{
    background: linear-gradient(135deg, #ff8c00, #ff6a00);
    box-shadow: 0 0 25px rgba(249,115,22,0.6); font-size:16px; padding:16px; width:100%;
  }
 .btn.orange:hover{box-shadow: 0 0 35px rgba(249,115,22,0.9);}

 .timer{
    font-size:28px; font-weight:800; color:var(--accent); text-align:center;
    background:rgba(0,0,0,0.5); padding:12px; border-radius:12px; border:1px solid var(--border);
  }

 .quiz-card{background:rgba(0,0,0,0.4); padding:20px; border-radius:16px; margin-bottom:16px; border-left:4px solid var(--accent);}
 .quiz-option{
    padding:14px; margin:8px 0; background:var(--glass); border-radius:12px; cursor:pointer;
    border:2px solid transparent; transition:0.2s;
  }
 .quiz-option:hover{border-color:var(--accent); background:rgba(0,212,255,0.1);}
 .quiz-option.correct{background:var(--green)!important; border-color:var(--green);}
 .quiz-option.wrong{background:var(--red)!important; border-color:var(--red);}

 .nav-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(35px, 1fr)); gap:8px; margin:12px 0; max-height:350px; overflow-y:auto;}
 .nav-btn{
    padding:8px; background:var(--glass); border:1px solid var(--border);
    border-radius:10px; color:#fff; cursor:pointer; font-size:11px; font-weight:700;
  }
 .nav-btn.done{background:#065f46; border-color:#22c55e;}.nav-btn.wrong{background:#7f1d1d; border-color:#ef4444;}.nav-btn.current{border:2px solid var(--accent); box-shadow:0 0 10px var(--accent);}

  /* INPUTS 5/10 */
 .ai-key{
    width:100%; padding:14px; background:rgba(0,0,0,0.4); border:1px solid #374151;
    border-radius:12px; color:#fff; margin-top:10px; font-size:14px;
    transition:0.3s;
  }
 .ai-key:focus{border-color:var(--accent); box-shadow:0 0 15px rgba(0,212,255,0.3); outline:none;}

 .badge{
    background:linear-gradient(135deg, #f97316, #ea580c); padding:6px 12px;
    border-radius:20px; font-size:11px; font-weight:800; display:inline-block; margin-bottom:12px;
    box-shadow:0 0 15px rgba(249,115,22,0.5);
  }

  #ocrProgress{height:8px; background:#1f2937; border-radius:10px; overflow:hidden; margin-top:10px; display:none;}
  #ocrProgressBar{height:100%; width:0%; background:linear-gradient(90deg, #22c55e, #00d4ff); transition:0.3s;}

 .file-list{margin-top:12px; font-size:12px; color:var(--green);}
  canvas{display:none;}

 .memo-item{
    margin:15px 0; padding:18px; background:rgba(0,0,0,0.4); border-radius:12px;
    border-left:3px solid var(--accent);
  }
 .memo-correct{color:var(--green);}.memo-wrong{color:var(--red);}

 .mode-toggle{display:flex; gap:10px; margin:12px 0;}
 .mode-btn{
    padding:12px; background:var(--glass); border:2px solid #374151; border-radius:12px;
    color:#cbd5e1; cursor:pointer; flex:1; font-weight:700; transition:0.3s; display:flex; align-items:center; justify-content:center; gap:8px;
  }
 .mode-btn:hover{border-color:var(--accent);}
 .mode-btn.active{
    border-color:var(--accent); background:rgba(0,212,255,0.15); color:#fff;
    box-shadow:0 0 15px rgba(0,212,255,0.3);
  }

 .explanation{
    margin-top:10px; padding:12px; background:rgba(0,212,255,0.1); border-radius:10px;
    font-size:13px; color:#a5f3fc; border-left:3px solid var(--accent);
  }
</style>
</head>
<body>
<div class="calc">
  <h1>SHANA CALC TECH PARADISE V4.1</h1>
  <p class="subtitle">GOD TIER | OFFLINE AI | 47 SUBJECTS</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event,'secondary')">SECONDARY G8-12</button>
    <button class="tab-btn" onclick="switchTab(event,'primary')">PRIMARY R-7</button>
    <button class="tab-btn" onclick="switchTab(event,'tvet')">TVET N1-N6</button>
    <button class="tab-btn" onclick="switchTab(event,'university')">UNIVERSITY</button>
  </div>

  <div id="menu">
    <div class="grid">
      <div class="card">
        <h2>1. SELECT LEVEL & SUBJECT</h2>
        <div id="subjectList"></div>
      </div>

      <div class="card">
        <h2>2. SMART AI: UPLOAD YOUR NOTES</h2>
        <span class="badge">AUTO-ANSWER MODE</span>
        <p style="font-size:13px; color:#94a3b8; margin-bottom:10px;">Works with Notes OR Question Papers. AI will create answers</p>

        <div class="mode-toggle">
          <button class="mode-btn active" id="modeNotes" onclick="setMode('notes')">📚 Notes Mode</button>
          <button class="mode-btn" id="modeQuestions" onclick="setMode('questions')">❓ Question Paper Mode</button>
        </div>

        <label class="upload-box" for="fileUpload">
          📤 Click or Drag Files Here<br>
          <small>JPG, PNG, PDF, TXT - Multiple files</small>
          <input type="file" id="fileUpload" accept=".pdf,.jpg,.jpeg,.png,.txt" multiple onchange="handleUpload(event)">
        </label>
        <div id="fileList" class="file-list"></div>
        <div id="ocrProgress"><div id="ocrProgressBar"></div></div>

        <textarea id="notesPaste" class="ai-key" placeholder="OR Paste your notes/questions here..." style="height:120px; margin-top:10px;"></textarea>

        <select id="levelSelect" class="ai-key" onchange="updateGradeOptions()">
          <option value="primary">Primary R-7</option>
          <option value="secondary" selected>Secondary G8-12</option>
          <option value="tvet">TVET N1-N6</option>
          <option value="university">University Year 1</option>
        </select>

        <select id="gradeSelect" class="ai-key"></select>
        <select id="subjectSelect" class="ai-key"></select>

        <button class="btn orange" onclick="generateFromNotes()">✨ GENERATE 30 QUESTIONS + AI ANSWERS</button>
        <div id="uploadStatus" style="margin-top:10px; font-size:12px;"></div>
      </div>
    </div>

    <div class="card" style="margin-top:15px;">
      <h2>3. MY SAVED QUESTION BANKS</h2>
      <div id="savedBanks">No banks yet. Generate from notes above.</div>
      <button class="btn yellow" onclick="clearStorage()">Clear All Local Data</button>
    </div>
  </div>

  <div id="examArea" style="display:none;">
    <div class="timer" id="timer">Time: 02:00:00</div>
    <div id="navGrid" class="nav-grid"></div>
    <div id="paperTitle" style="text-align:center; font-weight:800; margin:15px 0; font-size:18px;"></div>
    <div id="questionsArea"></div>
    <div style="display:flex; justify-content:space-between;">
      <button class="btn yellow" onclick="prevQ()">← Previous</button>
      <button class="btn" onclick="nextQ()">Next →</button>
    </div>
    <button class="btn" onclick="backToMenu()">← Back to Menu</button>
    <button class="btn red" id="submitBtn" onclick="submitPaper()">SUBMIT PAPER</button>
    <div id="memoArea" style="margin-top:20px; padding:18px; background:#000; border-radius:14px; display:none;"></div>
  </div>
</div>
<canvas id="canvas"></canvas>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentPaper=[], userAnswers=[], timer, timeLeft=7200, currentQ=0;
let myBanks = JSON.parse(localStorage.getItem('shanaBanks')) || {};
let currentTab = 'secondary';
let uploadedText = '';
let tesseractWorker = null;
let currentMode = 'notes'; // 'notes' or 'questions'

const subjectData = {
  primary: ['Grade R','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7'],
  secondary: ['Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'],
  tvet: ['N1','N2','N3','N4','N5','N6'],
  university: ['Year 1 Semester 1','Year 1 Semester 2']
}
const subjectsByLevel = {
  primary: ['Mathematics','English HL','Natural Science','Social Science','Life Skills','Technology','Creative Arts','Sepedi HL','IsiZulu HL'],
  secondary: ['Mathematics','Math Literacy','Physical Science','Life Science','Civil Technology','Mechanical Technology','Electrical Technology','Engineering Graphics','Accounting','Business Studies','Economics','Geography','History','English FAL','Afrikaans FAL','IsiZulu FAL','Life Orientation','IT','CAT','Consumer Studies','Tourism','Hospitality'],
  tvet: ['Building Science','Engineering Drawing','Mathematics N3','Industrial Organisation','Civil Construction','Trade Theory','Plant Operation','Water Treatment','Electrical Trade Theory'],
  university: ['Calculus 1','Physics 1','Chemistry 1','Biology 1','Introduction to Engineering','Academic Literacy','Engineering Graphics','Programming 1','Statistics 1']
}

// ========== SHANA V4.0 KNOWLEDGE ENGINE - FILL THIS UP ==========
const KNOWLEDGE_ENGINE = {
  "Mathematics": [], "Math Literacy": [], "Physical Science": [],
  "Life Science": [
    {keywords: ["cellular respiration", "organelle", "atp"], ans: "Mitochondria", wrong: ["Chloroplast", "Ribosome", "Nucleus"], exp: "Mitochondria produce ATP through cellular respiration in both plant and animal cells."},
    {keywords: ["photosynthesis", "gas", "waste"], ans: "Oxygen", wrong: ["Carbon dioxide", "Nitrogen", "Glucose"], exp: "Oxygen is released as a waste product during the light-dependent reactions of photosynthesis."}
  ],
  "Civil Technology": [], "Mechanical Technology": [], "Electrical Technology": [], "Engineering Graphics": [],
  "Accounting": [], "Business Studies": [], "Economics": [], "Geography": [], "History": [],
  "English FAL": [], "Afrikaans FAL": [], "IsiZulu FAL": [], "Life Orientation": [], "IT": [], "CAT": [],
  "Consumer Studies": [], "Tourism": [], "Hospitality": [],
  "Natural Science": [], "Social Science": [], "Life Skills": [], "Technology": [], "Creative Arts": [],
  "Sepedi HL": [], "IsiZulu HL": [], "English HL": [],
  "Building Science": [], "Engineering Drawing": [], "Mathematics N3": [], "Industrial Organisation": [],
  "Civil Construction": [], "Trade Theory": [], "Plant Operation": [], "Water Treatment": [], "Electrical Trade Theory": [],
  "Calculus 1": [], "Physics 1": [], "Chemistry 1": [], "Biology 1": [], "Introduction to Engineering": [],
  "Academic Literacy": [], "Programming 1": [], "Statistics 1": []
}

function getAIAnswer(questionText, subject) {
  const bank = KNOWLEDGE_ENGINE[subject] || [];
  questionText = questionText.toLowerCase();
  let bestMatch = null; let highestScore = 0;
  bank.forEach(item => {
    let score = 0;
    item.keywords.forEach(kw => { if(questionText.includes(kw)) score++; });
    if(score > highestScore) { highestScore = score; bestMatch = item; }
  });
  if(!bestMatch || highestScore < 1) {
    return {ans: "Not in Knowledge Base", wrong: ["Check notes", "Research topic", "Ask teacher"], exp: "Add this to KNOWLEDGE_ENGINE['"+subject+"'] to teach SHANA."}
  }
  return bestMatch;
}

window.onload = async () => {
  switchTab(null, 'secondary');
  loadSavedBanks();
  tesseractWorker = await Tesseract.createWorker();
  await tesseractWorker.loadLanguage('eng');
  await tesseractWorker.initialize('eng');
}

function setMode(mode){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
}

function switchTab(event, tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(event) event.target.classList.add('active');
  else document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
  let html = '';
  subjectsByLevel[tab].forEach(sub=>{
    html += `<button class="subject-btn" onclick="alert('Upload notes first to generate questions for ${sub}')">${sub.toUpperCase()} - Test 50 Qs</button>`;
  });
  document.getElementById('subjectList').innerHTML = html;
  document.getElementById('levelSelect').value = tab;
  updateGradeOptions();
}

function updateGradeOptions(){
  const level = document.getElementById('levelSelect').value.toLowerCase();
  const gradeSel = document.getElementById('gradeSelect');
  const subjectSel = document.getElementById('subjectSelect');
  gradeSel.innerHTML = subjectData[level].map(g=>`<option>${g}</option>`).join('');
  subjectSel.innerHTML = subjectsByLevel[level].map(s=>`<option>${s}</option>`).join('');
}

function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }
function saveToStorage(){ localStorage.setItem('shanaBanks', JSON.stringify(myBanks)); loadSavedBanks(); }
function loadSavedBanks(){
  let html = '';
  for(let key in myBanks){
    html += `<div style="background:var(--glass); padding:12px; border-radius:10px; margin:5px 0; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border);">
      <span>${key} - ${myBanks[key].length} Qs</span>
      <button class="btn" onclick="startCustomBank('${key}')">Start Test</button>
    </div>`;
  }
  document.getElementById('savedBanks').innerHTML = html || 'No banks yet. Generate from notes above.';
}

function enhanceImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    img.onload = () => {
      const maxSize = 2000;
      let { width, height } = img;
      if(width > maxSize || height > maxSize){
        const ratio = Math.min(maxSize/width, maxSize/height);
        width *= ratio; height *= ratio;
      }
      canvas.width = width; canvas.height = height;
      ctx.filter = 'grayscale(100%) contrast(150%) brightness(110%)';
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(resolve, 'image/jpeg', 0.9);
    }
    img.src = URL.createObjectURL(file);
  });
}

async function handleUpload(e){
  const files = Array.from(e.target.files);
  if(files.length === 0) return;
  document.getElementById('fileList').innerHTML = files.map(f => `📄 ${f.name}`).join('<br>');
  document.getElementById('uploadStatus').innerText = `⏳ Reading ${files.length} files...`;
  document.getElementById('ocrProgress').style.display = 'block';
  let allText = ''; let completed = 0;
  const promises = files.map(async (file) => {
    try {
      if(file.type === 'text/plain'){ return await file.text() + '\n\n'; }
      else if(file.type.startsWith('image/')){
        const enhancedBlob = await enhanceImage(file);
        const result = await tesseractWorker.recognize(enhancedBlob);
        completed++; document.getElementById('ocrProgressBar').style.width = `${(completed/files.length)*100}%`;
        return result.data.text + '\n\n';
      } else if(file.type === 'application/pdf'){
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let pdfText = '';
        for(let i = 1; i <= pdf.numPages; i++){
          const page = await pdf.getPage(i); const content = await page.getTextContent();
          pdfText += content.items.map(item => item.str).join(' ') + '\n';
        }
        completed++; document.getElementById('ocrProgressBar').style.width = `${(completed/files.length)*100}%`;
        return pdfText + '\n\n';
      }
    } catch(err) { return ''; }
    return '';
  });
  const results = await Promise.all(promises);
  allText = results.join('');
  uploadedText = allText;
  document.getElementById('notesPaste').value = uploadedText;
  document.getElementById('uploadStatus').innerText = `✅ Read ${files.length} files! ${uploadedText.length} chars`;
  document.getElementById('ocrProgress').style.display = 'none';
}

function generateFromNotes(){
  const notes = document.getElementById('notesPaste').value || uploadedText;
  const level = document.getElementById('levelSelect').value;
  const grade = document.getElementById('gradeSelect').value;
  const subject = document.getElementById('subjectSelect').value;
  if(notes.length < 50) return alert('Please upload files or paste notes first. Need at least 50 characters');
  document.getElementById('uploadStatus').innerText = `⏳ GOD TIER AI is analyzing...`;
  let sentences = notes.split(/[.\n]/).filter(s => s.trim().length > 15);
  let questions = notes.split(/\n|\d+\.|Q\d+/i).filter(s => s.trim().length > 10 && s.includes('?'));
  let keywords = [...new Set(notes.split(' ').filter(w => w.length > 5))].slice(0, 50);
  currentPaper = [];
  const isQuestionPaper = questions.length > 3 || currentMode === 'questions';
  if(isQuestionPaper){
    document.getElementById('uploadStatus').innerText = `⏳ AI matching to Knowledge Base...`;
    for(let i=0; i<Math.min(10, questions.length); i++){
      let q = questions[i].trim();
      let ai = getAIAnswer(q, subject);
      let options = shuffle([ai.ans,...ai.wrong]);
      let correctIndex = options.indexOf(ai.ans);
      let correctLetter = ['A','B','C','D'][correctIndex];
      currentPaper.push({type: "MCQ", q: q, options: options.map((opt, idx) => `${['A','B','C','D'][idx]}) ${opt}`), ans: correctLetter, correctText: ai.ans, explanation: ai.exp, marks: 2});
    }
  } else {
    for(let i=0; i<10; i++){
      let correctAns = sentences[i % sentences.length] || "Based on your notes";
      let options = shuffle([correctAns, sentences[(i+3) % sentences.length], sentences[(i+7) % sentences.length], sentences[(i+11) % sentences.length]]);
      let correctLetter = ['A','B','C','D'][options.indexOf(correctAns)];
      currentPaper.push({type: "MCQ", q: `According to your notes on ${subject}, which statement is MOST accurate?`, options: options.map((opt, idx) => `${['A','B','C','D'][idx]}) ${opt}`), ans: correctLetter, correctText: correctAns, explanation: "Based on uploaded notes.", marks: 2});
    }
  }
  for(let i=10; i<20; i++){
    let term1 = keywords[i % keywords.length] || "Concept A";
    let term2 = keywords[(i+5) % keywords.length] || "Concept B";
    currentPaper.push({type: "ANALYSIS", q: `Analyze: Explain how "${term1}" and "${term2}" are connected in ${subject}. Give 1 example.`, keywords: [term1, term2, "example", subject], modelAnswer: `Explain the relationship between ${term1} and ${term2} with an example from ${subject}.`, explanation: "Link both concepts and give 1 relevant example.", marks: 4});
  }
  for(let i=20; i<30; i++){
    let problem = sentences[i % sentences.length] || "a concept from your notes";
    currentPaper.push({type: "EVAL", q: `Evaluate: ${problem}. Propose 2 solutions and justify which is best for ${grade} ${subject}`, keywords: ["solution", "justify", subject], modelAnswer: `Give 2 solutions and explain with reasons which one is better.`, explanation: "State 2 solutions, then justify with facts which is best.", marks: 6});
  }
  let bankName = `${level} ${grade} ${subject} V4.1 - ${new Date().toLocaleDateString()}`;
  myBanks[bankName] = currentPaper;
  saveToStorage();
  document.getElementById('uploadStatus').innerText = `✅ Generated ${currentPaper.length} SMART Q+A with AI!`;
}

function startCustomBank(name){
  currentPaper = shuffle([...myBanks[name]]);
  userAnswers = new Array(currentPaper.length).fill(null); currentQ = 0; timeLeft = currentPaper.length * 120;
  document.getElementById('menu').style.display = 'none'; document.getElementById('examArea').style.display = 'block';
  document.getElementById('paperTitle').innerText = `${name}\n${currentPaper.length} QUESTIONS`;
  buildNav(); showQuestion();
  clearInterval(timer); timer = setInterval(()=>{ timeLeft--; updateTimer(); if(timeLeft<=0) submitPaper(); },1000);
}

function updateTimer(){ let h=Math.floor(timeLeft/3600), m=Math.floor((timeLeft%3600)/60), s=timeLeft%60; document.getElementById('timer').innerText = `Time: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
function buildNav(){ let html=''; currentPaper.forEach((_,i)=>{ html+=`<button class="nav-btn" id="nav${i}" onclick="goToQ(${i})">${i+1}</button>`; }); document.getElementById('navGrid').innerHTML=html; updateNav(); }
function updateNav(){ currentPaper.forEach((_,i)=>{ let el=document.getElementById(`nav${i}`); if(el){ el.className='nav-btn'; if(i===currentQ) el.classList.add('current'); if(userAnswers[i]!==null) el.classList.add(userAnswers[i]?'done':'wrong'); } }); }
function showQuestion(){
  let q=currentPaper[currentQ];
  let html=`<div class="quiz-card"><h3>Q${currentQ+1}. [${q.marks} Mark${q.marks>1?'s':''}] ${q.q}</h3>`;
  if(q.type==="MCQ"){
    q.options.forEach(opt=>{ html+=`<div class="quiz-option" onclick="checkMCQ(this,'${opt.charAt(0)}')">${opt}</div>`; });
  } else {
    html+=`<textarea id="textAns" placeholder="Write a detailed answer..." style="width:100%; height:120px; background:rgba(0,0,0,0.4); color:#fff; border-radius:8px; padding:10px; border:1px solid #374151;">${userAnswers[currentQ]||''}</textarea><button class="btn" onclick="saveText()">Save Answer</button>`;
  }
  html+=`</div>`;
  document.getElementById('questionsArea').innerHTML=html;
  updateNav();
}
function checkMCQ(el, choice){
  userAnswers[currentQ] = choice;
  el.parentElement.querySelectorAll('.quiz-option').forEach(o=>o.classList.remove('correct','wrong'));
  el.classList.add('done');
  updateNav();
}
function saveText(){ userAnswers[currentQ] = document.getElementById('textAns').value; updateNav(); }
function nextQ(){ if(currentQ<currentPaper.length-1) currentQ++; showQuestion(); }
function prevQ(){ if(currentQ>0) currentQ--; showQuestion(); }
function goToQ(i){ currentQ=i; showQuestion(); }
function backToMenu(){ clearInterval(timer); document.getElementById('examArea').style.display='none'; document.getElementById('menu').style.display='block'; }
function clearStorage(){ if(confirm('Delete all saved banks?')){ localStorage.removeItem('shanaBanks'); myBanks={}; loadSavedBanks(); } }

function gradeTextAnswer(userAns, q){
  if(!userAns) return false;
  let lower = userAns.toLowerCase();
  let hits = q.keywords.filter(k=>lower.includes(k.toLowerCase())).length;
  return hits >= 2;
}

function submitPaper(){
  clearInterval(timer); let score=0, total=0, memoHtml='<h2>📊 YOUR RESULTS + AI TUTOR MEMO</h2>';
  currentPaper.forEach((q,i)=>{
    total+=q.marks;
    let userAns = userAnswers[i];
    let correct=false;
    if(q.type==="MCQ") { correct = (userAns === q.ans); if(correct) score+=q.marks; }
    else { correct = gradeTextAnswer(userAns, q); if(correct) score+=q.marks; }
    memoHtml += `<div class="memo-item">
      <b>Q${i+1} [${q.marks} marks]:</b> ${q.q}<br><br>
      <b>Your Answer:</b> <span class="${correct?'memo-correct':'memo-wrong'}">${userAns || 'No answer'}</span><br>
      <b>Memo/Answer:</b> <span class="memo-correct">${q.type==="MCQ"? q.ans + ') ' + q.correctText : q.modelAnswer}</span><br>
      ${q.explanation? `<div class="explanation"><b>AI Explanation:</b> ${q.explanation}</div>` : ''}
      <b>Status:</b> ${correct?'<span class="memo-correct">✓ Correct</span>':'<span class="memo-wrong">✗ Review this</span>'}
    </div>`;
  });
  let percent = ((score/total)*100).toFixed(1);
  memoHtml = `<h2>Final Score: ${score}/${total} = ${percent}%</h2><p style="color:#94a3b8; margin-bottom:15px;">Study the AI explanations below</p>` + memoHtml;
  document.getElementById('memoArea').innerHTML=memoHtml;
  document.getElementById('memoArea').style.display='block';
  document.getElementById('submitBtn').style.display='none';
}
</script>
</body>
</html>
