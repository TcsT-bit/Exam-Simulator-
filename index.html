<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHANA OS - SA EDUCATION NETWORK</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020409; --accent:#4285f4; --green:#34a853; --orange:#ff6d00; --text:#fff;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Google Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg); color:var(--text);}
.bg-grid{position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background: linear-gradient(rgba(66,133,244,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(66,133,244,0.05) 1px, transparent 1px); background-size: 40px 40px; animation: moveGrid 20s linear infinite;}
@keyframes moveGrid{ from{background-position:0 0;} to{background-position:40px 40px;} }
.container{max-width:100%; margin:auto; padding:20px 15px;}
.hero{text-align:center; padding:30px 0;}
.hero h1{font-size:38px; font-weight:900; background: linear-gradient(90deg, #fff, #8ab4f8, #34a853); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
select{width:100%; padding:16px; background:rgba(31,41,55,0.8); border:2px solid var(--accent); border-radius:16px; color:#fff; font-size:16px; font-weight:700; margin:10px 0;}
.stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:20px 0;}
.stat{background:rgba(17,24,39,0.6); padding:15px; border-radius:16px; text-align:center;}
.stat h3{font-size:22px; color:var(--accent);}.stat p{color:#9aa0a6; font-size:12px;}
.pillars{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin:30px 0;}
.pillar{background:rgba(17,24,39,0.6); padding:20px 15px; border-radius:20px; border:1px solid rgba(66,133,244,0.2); text-align:center; cursor:pointer;}
.pillar:active{transform:scale(0.95);}
.pillar.icon{font-size:32px;}.pillar h2{font-size:15px; margin-top:5px;}
.lb-item{display:flex; justify-content:space-between; padding:12px; background:rgba(17,24,39,0.6); margin-bottom:8px; border-radius:12px; border-left:4px solid var(--green);}
.btn{width:100%; padding:16px; background:linear-gradient(90deg, #4285f4, #34a853); border:none; border-radius:50px; color:#fff; font-size:16px; font-weight:900; cursor:pointer; margin-top:10px;}
.btn.orange{background:var(--orange);}
.modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:100; padding:15px; overflow-y:auto;}
.modal-content{background:rgba(17,24,39,0.98); padding:20px; border-radius:20px; border:1px solid var(--accent);}
.school-item{padding:14px; background:rgba(66,133,244,0.1); border-radius:12px; margin-bottom:8px; cursor:pointer;}
.close-btn{float:right; background:none; border:none; color:#fff; font-size:28px;}
.question-card{background:rgba(31,41,55,0.8); padding:16px; border-radius:16px; margin-bottom:12px; border-left:3px solid var(--accent);}
.input{width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid var(--accent); border-radius:10px; color:#fff; margin:8px 0;}
.badge{padding:6px 12px; background:var(--orange); color:#000; border-radius:20px; font-weight:700; font-size:11px;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">

  <select id="provinceSelect" onchange="changeProvince()">
    <option value="limpopo">LIMPOPO PROVINCE</option>
    <option value="gauteng">GAUTENG PROVINCE</option>
  </select>

  <select id="districtSelect" onchange="changeDistrict()">
    <option value="">SELECT DISTRICT</option>
  </select>

  <div class="hero">
    <span class="badge">POWERED BY AI • BUILT FOR SA CAPS</span>
    <h1>SHANA OS</h1>
    <p id="provinceTagline">The National Education Intelligence Network</p>
    <button class="btn" onclick="startFree()">START 60 DAY FREE TRIAL</button>

    <div class="stats">
      <div class="stat"><h3 id="provCount">0</h3><p>Schools</p></div>
      <div class="stat"><h3 id="distCount">0</h3><p>Districts</p></div>
      <div class="stat"><h3 id="avgScore">0%</h3><p>Avg Score</p></div>
    </div>
  </div>

  <div class="leaderboard"><h2 style="text-align:center;">🏆 PROVINCE LEADERBOARD</h2><div id="leaderboardList"></div></div>

  <h2 style="text-align:center;">CHOOSE LEVEL</h2>
  <div class="pillars">
    <div class="pillar" onclick="openLevel('primary')"><div class="icon">📚</div><h2>PRIMARY</h2></div>
    <div class="pillar" onclick="openLevel('secondary')"><div class="icon">🎓</div><h2>SECONDARY</h2></div>
    <div class="pillar" onclick="openLevel('tvet')"><div class="icon">🔧</div><h2>TVET</h2></div>
    <div class="pillar" onclick="openLevel('university')"><div class="icon">🏛️</div><h2>UNIVERSITY</h2></div>
  </div>
</div>

<!-- SCHOOL + TEST MODAL -->
<div id="schoolModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2 id="modalTitle"></h2>
    <div id="schoolList"></div>
    <div id="testEngine" style="display:none;">
      <h3>Generate Test for <span id="selectedSchool"></span></h3>
      <select id="subjectSelect" class="input" onchange="loadTopics()"></select>
      <select id="topicSelect" class="input"></select>
      <button class="btn orange" onclick="generateTest()">✨ Generate 30 Questions</button>
      <div id="testOutput"></div>
    </div>
  </div>
</div>

<script>
// ========== DATABASE ==========
const SA_DATA = {
  limpopo: {
    name: "LIMPOPO", schools: 2044, avg: 62,
    districts: {
      "Capricorn": ["Girls High - Polokwane", "Capricorn TVET - Polokwane"],
      "Greater Sekhukhune": ["Mampuru High - Greater Tubatse", "Makhuduthamaga Primary - Jane Furse", "Sekhukhune TVET - Burgersfort"],
      "Vhembe": ["University of Venda - Thohoyandou", "Vhembe TVET - Thohoyandou"]
    }
  },
  gauteng: {
    name: "GAUTENG", schools: 2100, avg: 78,
    districts: {
      "Johannesburg": ["Parktown Boys - Johannesburg", "Central Johannesburg TVET"],
      "Tshwane": ["Pretoria Boys High - Pretoria", "UP", "Tshwane North TVET"]
    }
  }
};

const KNOWLEDGE_ENGINE = {
  "Life Sciences": [
    {term:"Photosynthesis", define:"Process where plants use sunlight to make glucose", explain:"Occurs in chloroplasts using CO2 and H2O", apply:"Produces oxygen and food for ecosystem"},
    {term:"Cellular Respiration", define:"Breakdown of glucose to release energy", explain:"Occurs in mitochondria in presence of oxygen", apply:"Provides ATP for cellular activities"}
  ],
  "Mathematics": [
    {term:"Quadratic Equation", define:"Equation of form ax²+bx+c=0", explain:"Solved using formula or factorization", apply:"Used to model projectile motion"}
  ]
};

const PROVINCE_RANKING = [
  {name: "Western Cape", score: 81}, {name: "Gauteng", score: 78},
  {name: "Free State", score: 67}, {name: "KZN", score: 65},
  {name: "Mpumalanga", score: 64}, {name: "Limpopo", score: 62}
];

let CURRENT_PROVINCE = 'limpopo';
let CURRENT_DISTRICT = '';
let CURRENT_SCHOOL = '';

// ========== 2. DISTRICT DROPDOWN ==========
function changeProvince(){
  CURRENT_PROVINCE = document.getElementById('provinceSelect').value;
  let data = SA_DATA[CURRENT_PROVINCE];

  // Load districts
  let distHtml = '<option value="">ALL DISTRICTS</option>';
  Object.keys(data.districts).forEach(d => distHtml += `<option value="${d}">${d} DISTRICT</option>`);
  document.getElementById('districtSelect').innerHTML = distHtml;
  document.getElementById('distCount').innerText = Object.keys(data.districts).length;
  loadProvinceData();
}

function changeDistrict(){
  CURRENT_DISTRICT = document.getElementById('districtSelect').value;
}

// ========== 1. SCHOOL CLICK → TEST ENGINE ==========
function openLevel(level){
  let data = SA_DATA[CURRENT_PROVINCE];
  let schools = [];
  if(CURRENT_DISTRICT) schools = data.districts[CURRENT_DISTRICT];
  else Object.values(data.districts).forEach(arr => schools = schools.concat(arr));

  document.getElementById('modalTitle').innerText = `${level.toUpperCase()} SCHOOLS IN ${data.name}`;
  let listHtml = schools.map(school =>
    `<div class="school-item" onclick="openTestEngine('${school}', '${level}')">🏫 ${school}</div>`
  ).join('');
  document.getElementById('schoolList').innerHTML = listHtml;
  document.getElementById('schoolModal').style.display = 'block';
  document.getElementById('testEngine').style.display = 'none';
}

function openTestEngine(school, level){
  CURRENT_SCHOOL = school;
  document.getElementById('selectedSchool').innerText = school;
  document.getElementById('schoolList').style.display = 'none';
  document.getElementById('testEngine').style.display = 'block';

  // Load subjects
  document.getElementById('subjectSelect').innerHTML = Object.keys(KNOWLEDGE_ENGINE).map(s=>`<option>${s}</option>`).join('');
  loadTopics();
}

function loadTopics(){
  let subject = document.getElementById('subjectSelect').value;
  document.getElementById('topicSelect').innerHTML = KNOWLEDGE_ENGINE[subject].map(t=>`<option>${t.term}</option>`).join('');
}

function generateTest(){
  let subject = document.getElementById('subjectSelect').value;
  let bank = KNOWLEDGE_ENGINE[subject];
  let html = `<h4>Test for ${CURRENT_SCHOOL}</h4>`;
  bank.forEach((term, i)=>{
    html += `<div class="question-card">
      <b>Q${i+1}. Define ${term.term}</b>
      <textarea class="input" placeholder="Type your answer..."></textarea>
      <button class="btn" onclick="alert('Memo: ${term.define}')">Show Memo</button>
    </div>`;
  });
  document.getElementById('testOutput').innerHTML = html;
}

function loadProvinceData(){
  let data = SA_DATA[CURRENT_PROVINCE];
  document.getElementById('provinceTagline').innerText = `Performance Data for ${data.name}`;
  document.getElementById('provCount').innerText = data.schools.toLocaleString();
  document.getElementById('avgScore').innerText = data.avg + '%';

  let lbHtml = PROVINCE_RANKING.map((p, i) =>
    `<div class="lb-item"><span><b>#${i+1}</b> ${p.name}</span><span>${p.score}%</span></div>`
  ).join('');
  document.getElementById('leaderboardList').innerHTML = lbHtml;
}

function closeModal(){ document.getElementById('schoolModal').style.display = 'none'; }
function startFree(){ alert(`🚀 60 DAY FREE PRO TRIAL FOR ${SA_DATA[CURRENT_PROVINCE].name}`); }

window.onload = () => { changeProvince(); }
</script>
</body>
</html>
